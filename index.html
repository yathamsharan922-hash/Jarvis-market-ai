<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ARVIS - Market AI</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f19;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 24px 20px;
      text-align: center;
      border-bottom: 1px solid #252b38;
      background: #0d121f;
    }

    header h1 {
      font-size: 30px;
      letter-spacing: 1px;
    }

    header p {
      color: #8d96a8;
      margin-top: 7px;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .market {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: #131925;
      border: 1px solid #252b38;
      border-radius: 14px;
      padding: 17px;
      transition: 0.2s;
    }

    .card:hover {
      border-color: #3b82f6;
    }

    .card small {
      color: #8d96a8;
      font-size: 12px;
    }

    .card h2 {
      margin-top: 9px;
      font-size: 21px;
    }

    .chat {
      background: #131925;
      border: 1px solid #252b38;
      border-radius: 16px;
      min-height: 500px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 15px;
    }

    .message {
      padding: 13px;
      margin: 9px 0;
      border-radius: 12px;
      max-width: 88%;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #1d4ed8;
      margin-left: auto;
    }

    .ai {
      background: #202938;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 9px;
      border-top: 1px solid #252b38;
      padding-top: 13px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid #303848;
      background: #0b0f19;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      padding: 14px 19px;
      border: none;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #374151;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      margin-top: 12px;
    }

    @media (max-width: 600px) {

      .market {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 12px;
      }

      header h1 {
        font-size: 26px;
      }

      .chat {
        min-height: 520px;
      }

      .message {
        max-width: 94%;
      }

      button {
        padding: 14px;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>🤖 ARVIS</h1>

  <p>
    AI Market Intelligence Assistant
  </p>

</header>


<div class="container">


  <!-- MARKET CARDS -->

  <div class="market">


    <div class="card">

      <small>🇮🇳 NIFTY 50</small>

      <h2 id="nifty">
        Loading...
      </h2>

    </div>


    <div class="card">

      <small>🇺🇸 S&P 500</small>

      <h2 id="sp500">
        Loading...
      </h2>

    </div>


    <div class="card">

      <small>🥇 GOLD</small>

      <h2 id="gold">
        Loading...
      </h2>

    </div>


  </div>


  <!-- CHAT -->

  <div class="chat">


    <div id="messages">


      <div class="message ai">

        👋 Hello! I'm ARVIS,
        your AI market intelligence assistant.

        Ask me a question about markets,
        stocks, economics or financial topics.

      </div>


    </div>


    <!-- INPUT -->

    <div class="input-area">


      <input
        id="userInput"
        type="text"
        placeholder="Ask ARVIS..."
        autocomplete="off"
        onkeydown="handleKey(event)"
      >


      <button
        id="sendButton"
        onclick="sendMessage()"
      >

        Send

      </button>


    </div>


    <div class="status">

      ARVIS AI • Connected through Cloudflare

    </div>


  </div>


</div>


<script>


/* =========================================
   CLOUDFLARE WORKER URL
   ========================================= */

const WORKER_URL =
  "https://dry-union-1ed7.sharanyatham292.workers.dev/";


/* =========================================
   ADD MESSAGE
   ========================================= */

function addMessage(text, type) {

  const messages =
    document.getElementById("messages");

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  /*
    textContent is used instead of innerHTML
    so AI responses cannot inject HTML.
  */

  message.textContent = text;

  messages.appendChild(message);

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================================
   SEND MESSAGE TO ARVIS
   ========================================= */

async function sendMessage() {

  const input =
    document.getElementById("userInput");

  const button =
    document.getElementById("sendButton");

  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  /* Show user message */

  addMessage(
    text,
    "user"
  );


  /* Clear input */

  input.value = "";


  /* Disable button */

  button.disabled = true;

  button.textContent = "Thinking...";


  /* Temporary AI message */

  addMessage(
    "🤖 ARVIS is thinking...",
    "ai"
  );


  try {


    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })
        }
      );


    const data =
      await response.json();


    /* Remove thinking message */

    const messages =
      document.getElementById("messages");

    const lastMessage =
      messages.lastElementChild;


    if (
      lastMessage &&
      lastMessage.classList.contains("ai")
    ) {

      lastMessage.remove();

    }


    /* Check server error */

    if (!response.ok) {

      addMessage(
        "❌ ARVIS server error. Please try again.",
        "ai"
      );

      return;

    }


    /* Show AI response */

    if (data.answer) {

      addMessage(
        data.answer,
        "ai"
      );

    }

    else {

      addMessage(
        "⚠️ ARVIS received an empty response.",
        "ai"
      );

    }


  }

  catch (error) {


    console.error(error);


    /* Remove thinking message */

    const messages =
      document.getElementById("messages");

    const lastMessage =
      messages.lastElementChild;


    if (
      lastMessage &&
      lastMessage.classList.contains("ai")
    ) {

      lastMessage.remove();

    }


    addMessage(
      "❌ Connection error. Please check the Cloudflare Worker and try again.",
      "ai"
    );

  }


  /* Enable button */

  button.disabled = false;

  button.textContent = "Send";

}


/* =========================================
   ENTER KEY
   ========================================= */

function handleKey(event) {

  if (event.key === "Enter") {

    sendMessage();

  }

}


/* =========================================
   DEMO MARKET VALUES
   =========================================

   These are placeholders only.
   They are NOT live market prices.

   We will connect real market data later.
   ========================================= */

document.getElementById("nifty").innerText =
  "26,000";

document.getElementById("sp500").innerText =
  "6,500";

document.getElementById("gold").innerText =
  "$3,800";


</script>


</body>

</html>
